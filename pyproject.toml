[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhir12345", email = "133625954+Abhir12345@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=0.20",
    "anthropic>=0.25",
    "datasets>=2.14",
    "jupyter>=1.0",
    "librosa>=0.10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "tiktoken>=0.5",
    "tokenizers>=0.13",
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "transformers>=4.30",
]

[project.scripts]
ai-engineering-from-scratch = "ai_engineering_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
